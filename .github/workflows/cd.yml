name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        run: pytest


  build:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }} \
            -t ghcr.io/${{ github.repository }}:latest \
            .

      - name: Push Docker Images
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          docker push ghcr.io/${{ github.repository }}:latest


  deploy-staging:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Versioned Image
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}

      - name: Deploy Staging
        run: |
          docker run -d \
            --name mlops-api-staging \
            -p 5000:5000 \
            ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}

      - name: Wait for Application
        run: sleep 5

      - name: Staging Health Check
        run: |
          curl --fail http://localhost:5000/health

      - name: Display Staging Container
        run: |
          docker ps


  deploy-production:
    needs:
      - build
      - deploy-staging

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Same Versioned Image
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}

      - name: Deploy Production
        run: |
          docker run -d \
            --name mlops-api-production \
            -p 5000:5000 \
            ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}

      - name: Wait for Application
        run: sleep 5

      - name: Production Health Check
        run: |
          curl --fail http://localhost:5000/health

      - name: Display Production Container
        run: |
          docker ps
